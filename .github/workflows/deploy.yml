name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=team_dMIjwVL6eMf3OyxIzLoGOmzC
        env:
          VERCEL_ORG_ID: team_dMIjwVL6eMf3OyxIzLoGOmzC
          VERCEL_PROJECT_ID: prj_RQ85uJSKoCUpIjeAm9YpdAtEVypN
